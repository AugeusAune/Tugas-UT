<div>
  <div class="action-bar" style="position:sticky;top:60px;z-index:1000;background:#fff;border-bottom:1px solid #e2e8f0">
    <div class="action-container" style="max-width:1000px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem;height:64px">
      <input v-model="searchQuery" class="f-field" placeholder="Cari Nomor DO / NIM..." style="width:350px" @keyup.enter="searchDO" @keyup.esc="clearSearch" />
    </div>
  </div>

  <div class="main" style="max-width:1000px;margin:1.5rem auto;padding:0 1.5rem">
    <div v-if="Object.keys(filteredData).length === 0" style="padding:8rem 0;text-align:center;color:#cbd5e1">
      <p style="font-weight:700;color:#94a3b8;font-size:0.8rem">TIDAK ADA DATA PENGIRIMAN</p>
    </div>

    <div v-for="(item, doNum) in filteredData" :key="doNum" class="track-card" style="background:white;border:1px solid #e2e8f0;border-radius:14px;padding:1.5rem;margin-bottom:1.5rem">
      <div class="card-head" style="display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px dashed #f1f5f9;padding-bottom:1rem;margin-bottom:1.5rem">
        <div>
          <div class="do-label" style="font-size:0.65rem;font-weight:700;color:#94a3b8;text-transform:uppercase">Nomor Delivery Order</div>
          <div class="do-val" style="font-family:Inter,sans-serif;font-size:1.25rem;font-weight:800;color:#1e3a8a">{{ doNum }}</div>
        </div>
        <span class="pill" :class="statusClass(item.status)">{{ item.status }}</span>
      </div>

      <div class="info-grid" style="display:grid;grid-template-columns:repeat(2,1fr);gap:1rem;margin-bottom:1.5rem">
        <div class="info-card" style="background:#f8fafc;border:1px solid #f1f5f9;border-radius:10px;padding:1rem">
          <div class="i-lb" style="font-size:0.62rem;font-weight:700;color:#94a3b8;text-transform:uppercase">Penerima</div>
          <div class="i-tx" style="font-size:0.875rem;font-weight:700;color:#475569">{{ item.nama }} ({{ item.nim }})</div>
        </div>
        <div class="info-card" style="background:#f8fafc;border:1px solid #f1f5f9;border-radius:10px;padding:1rem">
          <div class="i-lb" style="font-size:0.62rem;font-weight:700;color:#94a3b8;text-transform:uppercase">Ekspedisi</div>
          <div class="i-tx" style="font-size:0.875rem;font-weight:700;color:#475569">{{ item.ekspedisi }}</div>
        </div>
        <div class="info-card" style="background:#f8fafc;border:1px solid #f1f5f9;border-radius:10px;padding:1rem">
          <div class="i-lb" style="font-size:0.62rem;font-weight:700;color:#94a3b8;text-transform:uppercase">Paket</div>
          <div class="i-tx" style="font-size:0.875rem;font-weight:700;color:#475569">{{ item.paket }}</div>
        </div>
        <div class="info-card" style="background:#f8fafc;border:1px solid #f1f5f9;border-radius:10px;padding:1rem">
          <div class="i-lb" style="font-size:0.62rem;font-weight:700;color:#94a3b8;text-transform:uppercase">Total</div>
          <div class="i-tx" style="font-size:0.875rem;font-weight:700;color:#2563eb">{{ item.total | currency }}</div>
        </div>
      </div>

      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:0.5rem">
        <button @click="openAddStatus(doNum)" style="background:#2563eb;color:white;border:none;padding:0.35rem 1rem;border-radius:6px;font-weight:700;font-size:0.75rem;cursor:pointer">+ Tambah Status</button>
        <button @click="toggleExpand(doNum)" style="background:none;border:none;color:#2563eb;font-weight:700;font-size:0.7rem;display:flex;align-items:center;gap:0.4rem;cursor:pointer;padding:0.5rem;border-radius:6px">
          {{ expandedDO === doNum ? 'Tutup Detail' : 'Lihat Detail' }}
        </button>
      </div>

      <div v-if="expandedDO === doNum" class="tl-section" style="margin-top:1.5rem;border-top:1px solid #f1f5f9;padding-top:1.5rem">
        <div class="do-label" style="font-size:0.65rem;font-weight:700;color:#94a3b8;text-transform:uppercase;margin-bottom:1.5rem">Riwayat Perjalanan</div>
        <div class="timeline" style="position:relative;padding-left:1.75rem">
          <div style="position:absolute;left:7px;top:5px;bottom:5px;width:2px;background:#e2e8f0;border-radius:99px"></div>
          <div v-for="(p, idx) in [...item.perjalanan].reverse()" :key="idx" class="tl-item" style="position:relative;margin-bottom:1.5rem">
            <div class="tl-dot" style="position:absolute;left:-1.75rem;top:4px;width:16px;height:16px;border-radius:50%;border:3px solid #fff;background:#cbd5e1;z-index:10" :style="idx === 0 ? 'background:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,0.15)' : ''"></div>
            <div class="tl-card" style="background:#f8fafc;border:1px solid #f1f5f9;padding:0.75rem 1rem;border-radius:10px" :style="idx === 0 ? 'background:#f0fdf4;border-color:#dcfce7' : ''">
              <div class="tl-date" style="font-size:0.68rem;font-weight:700;color:#94a3b8;text-transform:uppercase;margin-bottom:0.25rem">{{ p.waktu }}</div>
              <div class="tl-msg" style="font-size:0.85rem;font-weight:600;color:#64748b" :style="idx === 0 ? 'color:#0f172a;font-weight:700' : ''">{{ p.keterangan }}</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div v-if="showStatusModal" class="m-overlay" style="position:fixed;inset:0;background:rgba(15,23,42,0.6);z-index:3000;display:flex;align-items:center;justify-content:center;padding:1rem">
    <div class="track-card" style="background:white;border:1px solid #e2e8f0;border-radius:14px;padding:1.5rem;width:100%;max-width:420px">
      <h3 style="margin-top:0;color:#1e3a8a;font-size:1rem">Tambah Status Progress</h3>
      <div style="margin-top:1.5rem">
        <label class="i-lb" style="font-size:0.62rem;font-weight:700;color:#94a3b8;text-transform:uppercase">Keterangan</label>
        <input v-model="statusForm.keterangan" class="f-field" style="width:100%;margin-top:0.3rem" placeholder="Masukkan keterangan status..." @keyup.enter="submitStatus" />
      </div>
      <div style="margin-top:2rem;display:flex;justify-content:flex-end;gap:0.75rem">
        <button @click="closeStatusModal" style="background:none;border:none;color:#94a3b8;font-weight:800;cursor:pointer;font-size:0.75rem">Batal</button>
        <button @click="submitStatus" style="background:#2563eb;color:white;border:none;padding:0.45rem 1.25rem;border-radius:8px;font-weight:700;font-size:0.8rem;cursor:pointer">Simpan</button>
      </div>
    </div>
  </div>
</div>
